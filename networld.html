<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detetor Avançado de Gama IP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .status { font-weight: bold; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .padrao { background-color: #d4edda; color: #155724; }
        .outra { background-color: #fff3cd; color: #856404; }
        .erro { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Análise de Gama de Rede</h2>
        
        <p><strong>IP Público Detetado:</strong> <span id="ip-publico">A verificar...</span></p>
        <p><strong>Validação (Público):</strong> <span id="status-publico" class="status">A aguardar...</span></p>
        
        <hr>
        
        <p><strong>IP Local (WebRTC):</strong> <span id="ip-local">A tentar ler...</span></p>
        <p><strong>Validação (Local):</strong> <span id="status-local" class="status">A aguardar...</span></p>
    </div>

    <script>
        // CONFIGURAÇÃO: Defina aqui a gama ou sub-rede padrão que deseja validar
        const GAMA_PADRAO = '192.168.1.'; // Valida especificamente a sub-rede 192.168.1.X

        // 1. ANÁLISE DO IP PÚBLICO (Via API externa)
        fetch('https://ipify.org')
            .then(response => response.json())
            .then(data => {
                const ip = data.ip;
                document.getElementById('ip-publico').innerText = ip;
                validarGama(ip, 'status-publico');
            })
            .catch(error => {
                document.getElementById('ip-publico').innerText = "Não disponível (Offline?)";
                document.getElementById('status-publico').innerText = "Erro ao validar";
                document.getElementById('status-publico').className = "status erro";
            });

        // 2. ANÁLISE DO IP LOCAL (Via WebRTC Leak)
        async function detetarIPLocal() {
            const statusLocal = document.getElementById('status-local');
            const ipLocalEl = document.getElementById('ip-local');
            
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                pc.createDataChannel("");
                
                pc.onicecandidate = (event) => {
                    if (!event.candidate) return;
                    
                    // Regex para extrair formatos IPv4 válidos da string do ICE Candidate
                    const regex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                    const match = regex.exec(event.candidate.candidate);
                    
                    if (match) {
                        const ipLocal = match[1];
                        ipLocalEl.innerText = ipLocal;
                        validarGama(ipLocal, 'status-local');
                        pc.onicecandidate = null; // Para a execução após encontrar o primeiro IP
                    }
                };

                await pc.createOffer().then(offer => pc.setLocalDescription(offer));
                
                // Timeout caso o navegador mascare o IP local com mDNS (.local) devido a regras de privacidade
                setTimeout(() => {
                    if (ipLocalEl.innerText === "A tentar ler...") {
                        ipLocalEl.innerText = "Oculto pelo Navegador (mDNS Protegido)";
                        statusLocal.innerText = "Não foi possível validar a LAN";
                        statusLocal.className = "status outra";
                    }
                }, 3000);

            } catch (e) {
                ipLocalEl.innerText = "Não suportado pelo navegador";
                statusLocal.innerText = "Erro no WebRTC";
                statusLocal.className = "status erro";
            }
        }

        // 3. FUNÇÃO AUXILIAR DE VALIDAÇÃO
        function validarGama(ip, elementoId) {
            const elemento = document.getElementById(elementoId);
            
            // Verifica se o IP começa com o padrão definido (Ex: '192.168.1.' ou apenas '192.')
            if (ip.startsWith(GAMA_PADRAO) || ip.startsWith('192.')) {
                elemento.innerText = "Gama Padrão (192.x)";
                elemento.className = "status padrao";
            } else {
                elemento.innerText = "Outra Gama Ativa";
                elemento.className = "status outra";
            }
        }

        // Inicia a execução local
        detetarIPLocal();
    </script>
</body>
</html>
